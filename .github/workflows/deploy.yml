name: Deploy Java to Alwaysdata

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    - name: Copy files to Alwaysdata
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.ALWAYSDATA_HOST }}
        username: ${{ secrets.ALWAYSDATA_USER }}
        password: ${{ secrets.ALWAYSDATA_PASSWORD }}
        source: "target/*.jar,src/**,pom.xml"
        target: "/home/dadagame/www"

    - name: Restart application on Alwaysdata
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.ALWAYSDATA_HOST }}
        username: ${{ secrets.ALWAYSDATA_USER }}
        password: ${{ secrets.ALWAYSDATA_PASSWORD }}
        timeout: "30s"
        script: |
          cd /home/ton-nom-utilisateur/ton-dossier-de-projet
          pkill -f java || true
          exit 0